<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>六毛 - 重置密码</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #edf4f7; color: #263746; }
    main { width: min(92vw, 430px); box-sizing: border-box; padding: 30px; border: 1px solid #d6e1e6; border-radius: 18px; background: #fff; box-shadow: 0 12px 40px #26374618; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { line-height: 1.65; color: #667984; }
    label { display: block; margin: 18px 0 7px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #b8ccd6; border-radius: 9px; font-size: 16px; }
    button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 9px; color: #075d57; background: #d8efeb; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .status { margin-top: 18px; padding: 10px 12px; border-radius: 9px; background: #e1efec; color: #087f74; white-space: pre-wrap; }
    .error { background: #f7e5e5; color: #a33a3a; }
    .hidden { display: none; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1>六毛账号 · 重置密码</h1>
    <p id="intro">正在验证密码重置链接…</p>
    <form id="form" class="hidden">
      <label for="password">新密码</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required>
      <p>至少 8 位，建议包含字母和数字。</p>
      <label for="confirm">确认新密码</label>
      <input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
      <button id="submit" type="submit">确认重置密码</button>
    </form>
    <div id="status" class="status hidden"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://zkgctfntrioffpifiggk.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_NDLwrZ6ikXYZP8hPpxthNw_OlU5cXq4";
    const intro = document.getElementById("intro");
    const form = document.getElementById("form");
    const status = document.getElementById("status");
    const submit = document.getElementById("submit");
    const show = (message, error = false) => {
      status.textContent = message;
      status.className = `status${error ? " error" : ""}`;
      status.classList.remove("hidden");
    };

    async function start() {
      if (!window.supabase || !window.supabase.createClient) {
        intro.textContent = "重置页面加载失败，请稍后重新打开邮件链接。";
        show("无法加载认证服务。", true);
        return;
      }
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: true }
      });
      const { data, error } = await client.auth.getSession();
      if (error || !data.session) {
        intro.textContent = "这个重置链接无效或已过期，请回到六毛登录页重新发送。";
        show("请不要重复使用旧邮件链接。", true);
        return;
      }
      intro.textContent = "请输入新密码。此页面不会保存你的密码。";
      form.classList.remove("hidden");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;
        if (password.length < 8) { show("新密码至少需要 8 位。", true); return; }
        if (password !== confirm) { show("两次输入的新密码不一致。", true); return; }
        submit.disabled = true;
        show("正在保存新密码…");
        const result = await client.auth.updateUser({ password });
        submit.disabled = false;
        if (result.error) { show("密码重置失败：" + result.error.message, true); return; }
        form.classList.add("hidden");
        intro.textContent = "密码已重置成功。请回到六毛软件，用新密码登录。";
        show("密码已修改；为保护账号安全，这个恢复会话已结束。", false);
        await client.auth.signOut();
        history.replaceState({}, document.title, window.location.pathname);
      });
    }
    start().catch(() => {
      intro.textContent = "重置页面暂时无法使用，请稍后重新打开邮件链接。";
      show("认证服务连接失败。", true);
    });
  </script>
</body>
</html>
