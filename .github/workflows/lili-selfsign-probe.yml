name: Disposable macOS self-signing identity probe

on:
  push:
    branches: ["codex/lili-selfsign-probe-20261106"]

permissions:
  contents: read
  actions: write

jobs:
  probe:
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - name: Cancel the earlier stalled disposable probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/42153123884/cancel" || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test whether two versions retain a certificate-anchored identity
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$RUNNER_TEMP/lili-identity-probe"
          mkdir -p "$probe_dir"
          probe_password="$(openssl rand -hex 24)"
          echo "::add-mask::$probe_password"
          probe_keychain="$probe_dir/probe.keychain-db"
          probe_cert="$probe_dir/probe.pem"
          cleanup() {
            perl -e 'alarm 15; exec @ARGV' sudo -n security remove-trusted-cert -d "$probe_cert" >/dev/null 2>&1 || true
            perl -e 'alarm 15; exec @ARGV' security delete-keychain "$probe_keychain" >/dev/null 2>&1 || true
            rm -rf "$probe_dir"
          }
          trap cleanup EXIT
          cat > "$probe_dir/openssl.cnf" <<'CONFIG'
          [req]
          prompt=no
          distinguished_name=dn
          x509_extensions=ext
          [dn]
          CN=Lili Ephemeral Code Signing Probe
          [ext]
          basicConstraints=critical,CA:TRUE
          keyUsage=critical,digitalSignature,keyCertSign
          extendedKeyUsage=codeSigning
          subjectKeyIdentifier=hash
          authorityKeyIdentifier=keyid:always
          CONFIG
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$probe_dir/key.pem" -out "$probe_cert" -days 2 -config "$probe_dir/openssl.cnf" -extensions ext >/dev/null 2>&1
          openssl pkcs12 -export -legacy -inkey "$probe_dir/key.pem" -in "$probe_cert" -out "$probe_dir/probe.p12" -name "Lili Ephemeral Code Signing Probe" -passout "pass:$probe_password"
          security create-keychain -p "$probe_password" "$probe_keychain"
          security unlock-keychain -p "$probe_password" "$probe_keychain"
          security list-keychains -d user -s "$probe_keychain"
          echo "Importing test identity"
          perl -e 'alarm 40; exec @ARGV' security import "$probe_dir/probe.p12" -k "$probe_keychain" -P "$probe_password" -T /usr/bin/codesign
          echo "Configuring test key access"
          perl -e 'alarm 40; exec @ARGV' security set-key-partition-list -S apple-tool:,apple: -s -k "$probe_password" "$probe_keychain" >/dev/null
          echo "Adding temporary code-signing trust"
          perl -e 'alarm 40; exec @ARGV' sudo -n security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$probe_cert"
          echo "Checking test identity"
          identity_hash="$(perl -e 'alarm 40; exec @ARGV' security find-identity -v -p codesigning "$probe_keychain" | awk '/Lili Ephemeral Code Signing Probe/ { print $2; exit }')"
          [[ "$identity_hash" =~ ^[A-F0-9]{40}$ ]]
          for version in one two; do
            app="$probe_dir/$version.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp /usr/bin/true "$app/Contents/MacOS/LiliProbe"
            cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleIdentifier</key><string>test.lili.stable.probe</string><key>CFBundleExecutable</key><string>LiliProbe</string></dict></plist>
          PLIST
            printf '%s\n' "$version" > "$app/Contents/Resources/version.txt"
            echo "Signing test app $version"
            perl -e 'alarm 40; exec @ARGV' codesign --force --timestamp=none --keychain "$probe_keychain" --sign "$identity_hash" "$app"
            codesign --verify --strict "$app"
          done
          requirement="$(codesign --display -r - "$probe_dir/one.app" 2>&1 | sed -n 's/^designated => //p')"
          test -n "$requirement"
          case "$requirement" in *cdhash*) echo "Identity unexpectedly depends on file hash" >&2; exit 1;; esac
          codesign --verify --strict -R "=$requirement" "$probe_dir/two.app"
          reverse="$(codesign --display -r - "$probe_dir/two.app" 2>&1 | sed -n 's/^designated => //p')"
          codesign --verify --strict -R "=$reverse" "$probe_dir/one.app"
          echo "Two different app versions satisfy each other's designated requirements."
          echo "Building the actual Lili application"
          mkdir -p build/macos
          sips -s format icns assets/icons/pet.png --out build/macos/pet.icns >/dev/null
          ONEPIC_INCLUDE_USER_ASSETS=0 python -m PyInstaller --noconfirm --clean OnePicDesktopPet.spec
          echo "Signing the actual Lili application"
          codesign --force --deep --timestamp=none --keychain "$probe_keychain" --sign "$identity_hash" dist/Lili.app
          codesign --verify --deep --strict dist/Lili.app
          ditto dist/Lili.app "$probe_dir/Lili-v2.app"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 0.23.999' "$probe_dir/Lili-v2.app/Contents/Info.plist"
          codesign --force --deep --timestamp=none --keychain "$probe_keychain" --sign "$identity_hash" "$probe_dir/Lili-v2.app"
          codesign --verify --deep --strict "$probe_dir/Lili-v2.app"
          requirement="$(codesign --display -r - dist/Lili.app 2>&1 | sed -n 's/^designated => //p')"
          test -n "$requirement"
          case "$requirement" in *cdhash*) echo "Lili identity unexpectedly depends on file hash" >&2; exit 1;; esac
          codesign --verify --strict -R "=$requirement" "$probe_dir/Lili-v2.app"
          reverse="$(codesign --display -r - "$probe_dir/Lili-v2.app" 2>&1 | sed -n 's/^designated => //p')"
          codesign --verify --strict -R "=$reverse" dist/Lili.app
          echo "Running the signed Lili app in an isolated data directory"
          QT_QPA_PLATFORM=cocoa ONEPIC_USE_DEMO_ASSETS=1 LOCALAPPDATA="$probe_dir/lili-data" LILI_DISABLE_CONTENT_UPDATES=1 LILI_DISABLE_PROGRAM_UPDATES=1 python -c 'import subprocess; subprocess.run(["dist/Lili.app/Contents/MacOS/Lili", "--smoke-test-ms", "2000"], timeout=60, check=True)'
          echo "Signed Lili bundle, cross-version identity and startup passed."
