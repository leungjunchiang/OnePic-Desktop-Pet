name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build public Windows package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1
      - name: Create Windows ZIP and checksum
        shell: powershell
        run: |
          Compress-Archive -Path .\dist\OnePicDesktopPet\* -DestinationPath .\dist\OnePicDesktopPet-Windows-x64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 .\dist\OnePicDesktopPet-Windows-x64.zip).Hash.ToLowerInvariant()
          "$hash  OnePicDesktopPet-Windows-x64.zip" | Set-Content -Encoding ascii .\dist\OnePicDesktopPet-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/OnePicDesktopPet-Windows-x64.zip
            dist/OnePicDesktopPet-Windows-x64.zip.sha256
          if-no-files-found: error

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build unsigned macOS DMG
        env:
          ONEPIC_MAC_ARCH: ${{ matrix.arch }}
        run: bash scripts/build_macos.sh
      - name: Create macOS checksum
        run: |
          cd dist
          shasum -a 256 "OnePicDesktopPet-macOS-${{ matrix.arch }}-unsigned.dmg" > "OnePicDesktopPet-macOS-${{ matrix.arch }}-unsigned.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: |
            dist/OnePicDesktopPet-macOS-${{ matrix.arch }}-unsigned.dmg
            dist/OnePicDesktopPet-macOS-${{ matrix.arch }}-unsigned.dmg.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-build
      - macos-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OnePic Desktop Pet $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Public Windows and unsigned macOS builds. No user_assets or private photos are included. The macOS DMG is unsigned because this project does not have an Apple Developer ID certificate."
