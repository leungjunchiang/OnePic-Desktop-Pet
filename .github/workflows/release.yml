name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe -m pytest
      - name: Build public Windows package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1
      - name: Create Windows ZIP and checksum
        shell: powershell
        run: |
          Compress-Archive -Path .\dist\Lili\* -DestinationPath .\dist\Lili-Windows-x64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 .\dist\Lili-Windows-x64.zip).Hash.ToLowerInvariant()
          "$hash  Lili-Windows-x64.zip" | Set-Content -Encoding ascii .\dist\Lili-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/Lili-Windows-x64.zip
            dist/Lili-Windows-x64.zip.sha256
          if-no-files-found: error

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build unsigned macOS DMG
        env:
          ONEPIC_MAC_ARCH: ${{ matrix.arch }}
        run: bash scripts/build_macos.sh
      - name: Create macOS checksum
        run: |
          cd dist
          shasum -a 256 "Lili-macOS-${{ matrix.arch }}-unsigned.dmg" > "Lili-macOS-${{ matrix.arch }}-unsigned.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: |
            dist/Lili-macOS-${{ matrix.arch }}-unsigned.dmg
            dist/Lili-macOS-${{ matrix.arch }}-unsigned.dmg.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-build
      - macos-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lili $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Lili 0.11：新增可选的搭子自习室，可通过搭子码互加、查看在线工作状态、创建私人房间、派六毛串门，并在双方桌面本地播放双六毛共同工作画面。支持隐身、隐藏准确时长和拒绝串门；断网后自动退回完整离线模式。服务器只保存昵称、六毛外观、状态、累计秒数、房间和串门事件，不保存任务、聊天、窗口标题或私人素材；密码不保存，刷新令牌位于系统凭据库。公开包不含 user_assets、私人照片、令牌、聊天记录或本机工作文件。macOS DMG 因没有 Apple Developer ID 证书而未公证。"
