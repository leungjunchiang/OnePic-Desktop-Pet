name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe -m pytest
      - name: Build public Windows package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1
      - name: Create Windows ZIP and checksum
        shell: powershell
        run: |
          Compress-Archive -Path .\dist\Lili\* -DestinationPath .\dist\Lili-Windows-x64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 .\dist\Lili-Windows-x64.zip).Hash.ToLowerInvariant()
          "$hash  Lili-Windows-x64.zip" | Set-Content -Encoding ascii .\dist\Lili-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/Lili-Windows-x64.zip
            dist/Lili-Windows-x64.zip.sha256
          if-no-files-found: error

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build unsigned macOS DMG
        env:
          ONEPIC_MAC_ARCH: ${{ matrix.arch }}
        run: bash scripts/build_macos.sh
      - name: Create macOS checksum
        run: |
          cd dist
          shasum -a 256 "Lili-macOS-${{ matrix.arch }}-unsigned.dmg" > "Lili-macOS-${{ matrix.arch }}-unsigned.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: |
            dist/Lili-macOS-${{ matrix.arch }}-unsigned.dmg
            dist/Lili-macOS-${{ matrix.arch }}-unsigned.dmg.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-build
      - macos-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lili $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Lili 0.13：新增 12 套按累计专注 1–12 小时自动更换的透明高清娃衣，修复 200% 高分屏完整动作裁切，加入可见的心情、精力、饱食和专注星；本地音乐支持网易云、QQ 与酷狗。搭子卡片清楚显示工作状态和今日时长，串门窗口显示两只完整六毛、双方今日累计和共同工作计时，动作仍只在本机播放。服务器只同步昵称、六毛外观、状态、累计秒数、房间与串门事件，不保存任务、聊天、窗口标题、动作帧或私人素材。公开包不含 user_assets、原图、源视频、私人歌词、令牌、聊天记录或本机工作文件。macOS DMG 因没有 Apple Developer ID 证书而未签名、公证。"
