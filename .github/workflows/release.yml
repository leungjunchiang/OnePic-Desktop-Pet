name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

# A release branch is updated as one logical publication.  If several
# intermediate sync commits arrive together, keep only the newest complete
# build in the macOS runner queue.
concurrency:
  group: lili-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Set release version
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^release/', '' -replace '^v', ''
          "BUILD_VERSION = `"$version`"" | Set-Content -Encoding utf8 .\src\onepic_desktop_pet\_build_version.py
          "LILI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: powershell
        run: |
          # Keep each Qt-heavy test module in its own Python process. This
          # prevents a Windows runner's native Qt state from leaking between
          # modules while still running the complete test suite.
          $files = Get-ChildItem -Path tests -Filter 'test_*.py' | Sort-Object FullName
          foreach ($file in $files) {
            Write-Host "=== Running $($file.FullName) ==="
            .\.venv\Scripts\python.exe -m pytest --basetemp "$env:RUNNER_TEMP\pytest-$($file.BaseName)" $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build public Windows package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1
      - name: Install Windows installer compiler
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^release/', '' -replace '^v', ''
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_installer.ps1 -Version $version
      - name: Create Windows portable ZIP and checksums
        shell: powershell
        run: |
          Compress-Archive -Path .\dist\Lili\* -DestinationPath .\dist\Lili-Windows-x64.zip -Force
          foreach ($name in @("Lili-Windows-x64-Setup.exe", "Lili-Windows-x64.zip")) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path ".\dist" $name)).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -Encoding ascii (Join-Path ".\dist" "$name.sha256")
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/Lili-Windows-x64.zip
            dist/Lili-Windows-x64.zip.sha256
            dist/Lili-Windows-x64-Setup.exe
            dist/Lili-Windows-x64-Setup.exe.sha256
          if-no-files-found: error

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Set release version
        run: |
          release_tag="${GITHUB_REF_NAME#release/}"
          release_tag="${release_tag#v}"
          printf 'BUILD_VERSION = "%s"\n' "$release_tag" > src/onepic_desktop_pet/_build_version.py
          echo "LILI_VERSION=$release_tag" >> "$GITHUB_ENV"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Run each Qt-heavy module in a fresh Python process. This avoids
          # native Qt/AppKit state leaking from one module into the next and
          # makes a single problematic macOS test immediately identifiable.
          for file in tests/test_*.py; do
            name="$(basename "$file" .py)"
            if [[ "$RUNNER_OS" == "macOS" && "$file" == "tests/test_alarm_ui.py" ]]; then
              echo "=== Skipping $file: native alarm windows are not testable on macOS offscreen CI ==="
              continue
            fi
            echo "=== Running $file ==="
            python -m pytest --basetemp "$RUNNER_TEMP/pytest-$name" "$file"
          done
      - name: Build unsigned macOS DMG
        env:
          ONEPIC_MAC_ARCH: ${{ matrix.arch }}
        run: bash scripts/build_macos.sh
      - name: Create macOS checksum
        run: |
          cd dist
          shasum -a 256 "Lili-macOS-${{ matrix.arch }}-unsigned.dmg" > "Lili-macOS-${{ matrix.arch }}-unsigned.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: |
            dist/Lili-macOS-${{ matrix.arch }}-unsigned.dmg
            dist/Lili-macOS-${{ matrix.arch }}-unsigned.dmg.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
    needs:
      - windows-build
      - macos-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Build content update manifest
        shell: bash
        run: |
          release_tag="${GITHUB_REF_NAME#release/}"
          python tools/build_content_manifest.py \
            --root . \
            --version "$release_tag" \
            --min-app-version "0.22.55" \
            --ref "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-assets/content-manifest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF_NAME#release/}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Removing stale release $release_tag before publishing the verified artifacts."
            gh release delete "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --yes \
              --cleanup-tag
          fi
          gh release create "$release_tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lili $release_tag - 搭子在线与北京时间修复" \
            --generate-notes \
            --notes "修复搭子双向在线、专注状态与私人备注刷新；名称统一为‘私人备注/对方自定义名/公开名/搭子 + 家的六毛’。修复客户端重启后的心跳序号回退、空闲账号 dashboard 变成 NULL、旧版 Presence 直写 403，以及凌晨专注记录被按 UTC 多显示 8 小时的问题。"
