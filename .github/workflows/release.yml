name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe -m pytest
      - name: Build public Windows package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1
      - name: Install Windows installer compiler
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^release/', '' -replace '^v', ''
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_installer.ps1 -Version $version
      - name: Create Windows portable ZIP and checksums
        shell: powershell
        run: |
          Compress-Archive -Path .\dist\Lili\* -DestinationPath .\dist\Lili-Windows-x64.zip -Force
          foreach ($name in @("Lili-Windows-x64-Setup.exe", "Lili-Windows-x64.zip")) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path ".\dist" $name)).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -Encoding ascii (Join-Path ".\dist" "$name.sha256")
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/Lili-Windows-x64.zip
            dist/Lili-Windows-x64.zip.sha256
            dist/Lili-Windows-x64-Setup.exe
            dist/Lili-Windows-x64-Setup.exe.sha256
          if-no-files-found: error

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build unsigned macOS DMG
        env:
          ONEPIC_MAC_ARCH: ${{ matrix.arch }}
        run: bash scripts/build_macos.sh
      - name: Create macOS checksum
        run: |
          cd dist
          shasum -a 256 "Lili-macOS-${{ matrix.arch }}-unsigned.dmg" > "Lili-macOS-${{ matrix.arch }}-unsigned.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: |
            dist/Lili-macOS-${{ matrix.arch }}-unsigned.dmg
            dist/Lili-macOS-${{ matrix.arch }}-unsigned.dmg.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
    needs:
      - windows-build
      - macos-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Build content update manifest
        shell: bash
        run: |
          release_tag="${GITHUB_REF_NAME#release/}"
          python tools/build_content_manifest.py \
            --root . \
            --version "$release_tag" \
            --min-app-version "0.22.45" \
            --ref "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-assets/content-manifest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF_NAME#release/}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$release_tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Lili $release_tag - Chat actions + Todo + content updates" \
              --generate-notes \
              --notes "Chat can now create, update, complete, delete, and query the same local Todo store; content-only updates are user-controllable and the compact Todo stays anchored to 六毛."
          fi

