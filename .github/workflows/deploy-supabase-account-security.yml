name: deploy-supabase-account-security

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/v*"
    paths:
      - "supabase/migrations/20260823000100_lili_account_security.sql"
      - ".github/workflows/deploy-supabase-account-security.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'zkgctfntrioffpifiggk' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply account-security migration
        shell: pwsh
        run: |
          $migration = Get-Content -Raw -LiteralPath "supabase/migrations/20260823000100_lili_account_security.sql"
          $encoded = [Uri]::EscapeDataString($env:SUPABASE_PROJECT_REF)
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN"; Accept = "application/json" }
          $body = @{ query = $migration } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$encoded/database/query" -Headers $headers -ContentType "application/json" -Body $body
