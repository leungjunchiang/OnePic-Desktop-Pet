name: deploy-supabase-focus-history

on:
  workflow_dispatch:
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply ordered sealed-focus sync contract
        shell: pwsh
        run: ./scripts/apply_supabase_focus_sync_migrations.ps1
