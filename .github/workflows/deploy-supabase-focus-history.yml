name: deploy-supabase-focus-history

on:
  workflow_dispatch:

# The ordered bootstrap includes historical backfills. Releases apply only
# their new migration through release.yml.

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: lili-deploy-focus-history
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply ordered sealed-focus sync contract
        shell: pwsh
        run: ./scripts/apply_supabase_focus_sync_migrations.ps1
