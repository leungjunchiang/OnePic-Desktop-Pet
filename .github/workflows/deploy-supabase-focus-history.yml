name: deploy-supabase-focus-history

on:
  workflow_dispatch:
  push:
    branches:
      - "release/v*"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply account-scoped daily focus history migration
        shell: pwsh
        run: ./scripts/apply_supabase_focus_history.ps1
      - name: Apply per-device live focus display migration
        shell: pwsh
        run: |
          ./scripts/apply_supabase_focus_history.ps1 `
            -MigrationPath "supabase/migrations/20260907090000_lili_focus_live_projection_read.sql"
