name: tests

on:
  push:
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        shell: powershell
        run: |
          # Keep each Qt-heavy test module in its own Python process. This
          # prevents a Windows runner's native Qt state from leaking between
          # modules while still running the complete test suite.
          $files = Get-ChildItem -Path tests -Filter 'test_*.py' | Sort-Object FullName
          foreach ($file in $files) {
            Write-Host "=== Running $($file.FullName) ==="
            python -m pytest --basetemp "$env:RUNNER_TEMP\pytest-$($file.BaseName)" $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check CloudBase proxy syntax and routes
        working-directory: relay/cloudbase-function
        run: |
          npm test
          npm run check
