name: tests

on:
  push:
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check CloudBase proxy syntax and routes
        working-directory: relay/cloudbase-function
        run: |
          npm test
          npm run check
