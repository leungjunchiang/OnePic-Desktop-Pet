name: publish-v0.19.1-once

on:
  push:
    branches:
      - agent/netease-ui-automation
    paths:
      - .github/workflows/publish-v0.19.1-once.yml

permissions:
  actions: write
  contents: write

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v0.19.1 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.19.1 >/dev/null 2>&1; then
            echo "v0.19.1 already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v0.19.1 -m "Lili 0.19.1"
            git push origin v0.19.1
          fi
          gh workflow run release.yml --ref v0.19.1 --repo "$GITHUB_REPOSITORY"
