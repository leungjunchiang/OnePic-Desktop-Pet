name: deploy-supabase-todo-sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/v*"
    tags:
      - "v*"
    paths:
      - "supabase/migrations/20260915120000_lili_todo_sync.sql"
      - "scripts/apply_supabase_todo_sync.ps1"
      - ".github/workflows/deploy-supabase-todo-sync.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'zkgctfntrioffpifiggk' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated Todo migration
        shell: pwsh
        run: ./scripts/apply_supabase_todo_sync.ps1
