name: publish-release-assets

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Successful workflow run ID containing the release artifacts"
        required: true
        type: string
      release_tag:
        description: "Existing GitHub Release tag"
        required: true
        default: "v0.20.1"
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts from the successful build
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true
      - name: Upload artifacts to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY"
          gh release upload "${{ inputs.release_tag }}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
