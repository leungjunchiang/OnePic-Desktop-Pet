name: publish-release-assets

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Successful workflow run ID containing the release artifacts"
        required: true
        type: string
      release_tag:
        description: "Existing GitHub Release tag"
        required: true
        default: "v0.22.0"
        type: string
      source_ref:
        description: "Optional exact source commit for a draft without a tag ref"
        required: false
        default: ""
        type: string
      skip_manifest:
        description: "Upload draft packages without a content-update manifest"
        required: false
        default: false
        type: boolean
      finalize_only:
        description: "Publish the verified existing draft without changing its uploaded packages"
        required: false
        default: false
        type: boolean
      include_macos:
        description: "Require both macOS DMGs and their checksums before publishing"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag }}
      - name: Verify draft source and successful build
        if: inputs.source_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" = "$SOURCE_REF"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" --jq .head_sha)" = "$SOURCE_REF"
      - name: Download artifacts from the successful build
        if: inputs.finalize_only != true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true
      - name: Build content update manifest
        if: inputs.skip_manifest != true && inputs.finalize_only != true
        shell: bash
        run: |
          python tools/build_content_manifest.py \
            --root . \
            --version "${{ inputs.release_tag }}" \
            --min-app-version "0.22.55" \
            --ref "${{ inputs.release_tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-assets/content-manifest.json
      - name: Archive exact draft source
        if: inputs.source_ref != '' && inputs.finalize_only != true
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          archive="Lili-$RELEASE_TAG-Source.zip"
          git archive --format=zip --prefix="Lili-$RELEASE_TAG/" --output="release-assets/$archive" HEAD
          cd release-assets
          sha256sum "$archive" > "$archive.sha256"
      - name: Upload artifacts to the existing release
        if: inputs.finalize_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY"
          gh release upload "${{ inputs.release_tag }}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - name: Publish verified desktop draft
        if: inputs.finalize_only == true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SKIP_MANIFEST: ${{ inputs.skip_manifest }}
          INCLUDE_MACOS: ${{ inputs.include_macos }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$SKIP_MANIFEST" = true
          test "$RELEASE_TAG" = "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          release_id="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release-metadata.json
          jq -e --arg tag "$RELEASE_TAG" --arg source "$SOURCE_REF" --argjson macos "$INCLUDE_MACOS" '
            .draft == true and .target_commitish == $source and
            ([.assets[].name] | sort) == ([
              ("Lili-" + $tag + "-Source.zip"), ("Lili-" + $tag + "-Source.zip.sha256"),
              "Lili-Windows-x64-Setup.exe", "Lili-Windows-x64-Setup.exe.sha256",
              "Lili-Windows-x64.zip", "Lili-Windows-x64.zip.sha256"] +
              (if $macos then ["Lili-macOS-arm64-unsigned.dmg", "Lili-macOS-arm64-unsigned.dmg.sha256",
                              "Lili-macOS-x64-unsigned.dmg", "Lili-macOS-x64-unsigned.dmg.sha256"] else [] end) | sort) and
            all(.assets[]; .state == "uploaded" and .size > 0) and
            all(.assets[] | select(.name | endswith(".sha256") | not);
                .digest | test("^sha256:[0-9a-f]{64}$"))
          ' release-metadata.json > /dev/null
          # Use the repository token so publishing the new tag does not recursively
          # trigger the unrelated tag-push deployment workflow. Only a release
          # containing all three desktop installers can become cross-platform latest.
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$INCLUDE_MACOS"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
