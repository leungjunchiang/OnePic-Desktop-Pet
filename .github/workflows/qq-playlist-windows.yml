name: QQ playlist Windows package

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project build dependencies
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Build public Windows package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1
      - name: Verify frozen audio helper
        shell: powershell
        run: .\.venv\Scripts\python.exe scripts/verify_packaged_alarm_audio.py dist/Lili/Lili.exe
      - name: Prepare installer compiler
        shell: powershell
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build installer and portable package
        shell: powershell
        run: |
          $version = .\.venv\Scripts\python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/Lili/* -DestinationPath dist/Lili-Windows-x64.zip
          foreach ($name in @('Lili-Windows-x64-Setup.exe', 'Lili-Windows-x64.zip')) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path dist $name)).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -Encoding ascii (Join-Path dist "$name.sha256")
          }
      - uses: actions/upload-artifact@v4
        with:
          name: qq-playlist-windows
          path: |
            dist/Lili-Windows-x64.zip
            dist/Lili-Windows-x64.zip.sha256
            dist/Lili-Windows-x64-Setup.exe
            dist/Lili-Windows-x64-Setup.exe.sha256
          if-no-files-found: error
