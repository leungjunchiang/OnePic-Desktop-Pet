[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "lili-desktop-pet"
version = "0.6.0"
description = "离线优先、可连接 Codex、DeepSeek 与 Kimi 的 Lili 桌面工作搭子。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.8,<7",
    "Pillow>=10,<13",
    "keyring>=25,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "PyInstaller>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
