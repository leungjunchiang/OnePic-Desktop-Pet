[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "lili-desktop-pet"
version = "0.22.55"
description = "Lili desktop work companion"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.8,<7",
    "Pillow>=10,<13",
    "keyring>=25,<27",
    "pyobjc-framework-Cocoa>=10,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10,<13; sys_platform == 'darwin'",
    "winrt-Windows.Media.Control>=3.2,<4; sys_platform == 'win32'",
    "uiautomation>=2.0,<3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "PyInstaller>=6,<7",
    "numpy>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

